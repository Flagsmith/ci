[project]
name = "flagsmith-ci"
version = "0.0.0"
description = "Continuous Integration tooling to integrate with Flagsmith."
requires-python = ">=3.14"

[dependency-groups]
dev = ["pre-commit"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "COM",    # flake8-commas (trailing commas)
    "RUF",    # Ruff-specific rules
]

# Standalone scripts declare dependencies via PEP 723 inline metadata
[[tool.ty.overrides]]
include = ["scripts/**"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"
