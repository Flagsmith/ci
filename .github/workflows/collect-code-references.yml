name: Collect Flagsmith code references

on:
  workflow_call:

    inputs:

      flagsmith_project_id:
        type: number
        description: Flagsmith project ID
        required: true

      flagsmith_admin_api_url:
        type: string
        description: Flagsmith admin API URL
        default: https://api.flagsmith.com

    secrets:

      flagsmith_admin_api_key:
        description: Flagsmith admin API key
        required: true

jobs:
  fetch-feature-names:
    name: "Flagsmith: Fetch feature names"
    runs-on: ubuntu-latest
    outputs:
      feature_names: ${{ steps.fetch-feature-names.outputs.feature_names }}
    steps:
      - name: Fetch feature names
        id: fetch-feature-names
        uses: Flagsmith/ci/.github/actions/fetch-feature-names@v1.0.0
        with:
          flagsmith_project_id: ${{ inputs.flagsmith_project_id }}
          flagsmith_admin_api_url: ${{ inputs.flagsmith_admin_api_url }}
          flagsmith_admin_api_key: ${{ secrets.flagsmith_admin_api_key }}

  scan-code-references:
    name: "Flagsmith: Scan code references"
    runs-on: ubuntu-latest
    needs: fetch-feature-names
    permissions:
      contents: read  # Required for actions/checkout to clone the repository
    outputs:
      code_references: ${{ steps.scan-code-references.outputs.code_references }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Scan code references
        id: scan-code-references
        uses: Flagsmith/ci/.github/actions/scan-code-references@v1.0.0
        with:
          feature_names: ${{ needs.fetch-feature-names.outputs.feature_names }}

  upload-code-references:
    name: "Flagsmith: Upload code references"
    runs-on: ubuntu-latest
    needs: scan-code-references
    steps:
      - name: Upload code references
        uses: Flagsmith/ci/.github/actions/upload-code-references@v1.0.0
        with:
          code_references: ${{ needs.scan-code-references.outputs.code_references }}
          flagsmith_project_id: ${{ inputs.flagsmith_project_id }}
          flagsmith_admin_api_url: ${{ inputs.flagsmith_admin_api_url }}
          flagsmith_admin_api_key: ${{ secrets.flagsmith_admin_api_key }}
          repository_url: ${{ github.server_url }}/${{ github.repository }}
          revision: ${{ github.sha }}
