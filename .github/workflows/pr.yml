name: PR

on:
  pull_request:
    types:
      - edited
      - opened
      - synchronize

jobs:
  lint-pr-title:
    name: Lint PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate conventional commit format
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Mirrors changelog-sections in release-please-config.json
          types: |
            feat
            fix
            infra
            ci
            docs
            deps
            perf
            refactor
            test
            chore
