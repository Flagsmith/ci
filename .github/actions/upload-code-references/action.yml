name: Upload code references
description: Upload code references to Flagsmith
author: Flagsmith

inputs:
  code_references:
    description: |
      JSON array of code references to upload.
      See https://api.flagsmith.com/api/v1/docs/#/api/api_v1_projects_code_references_create for the schema.
    required: true
  flagsmith_project_id:
    description: Flagsmith project ID
    required: true
  flagsmith_admin_api_url:
    description: Flagsmith admin API URL
    required: false
    default: https://api.flagsmith.com
  flagsmith_admin_api_key:
    description: Flagsmith admin API key
    required: true
  repository_url:
    description: URL of the repository being scanned
    required: true
  revision:
    description: Git revision (commit SHA) being scanned
    required: true
  vcs_provider:
    description: The VCS provider hosting the repository (e.g., github, gitlab)
    required: false
    default: github

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.14'
        enable-cache: true

    - name: Upload code references
      shell: bash
      env:
        CODE_REFERENCES: ${{ inputs.code_references }}
        FLAGSMITH_PROJECT_ID: ${{ inputs.flagsmith_project_id }}
        FLAGSMITH_ADMIN_API_URL: ${{ inputs.flagsmith_admin_api_url }}
        FLAGSMITH_ADMIN_API_KEY: ${{ inputs.flagsmith_admin_api_key }}
        REPOSITORY_URL: ${{ inputs.repository_url }}
        REVISION: ${{ inputs.revision }}
        VCS_PROVIDER: ${{ inputs.vcs_provider }}
      working-directory: ${{ github.action_path }}/../../..
      run: uv run upload-code-references
