name: Collect code references
description: Scan codebase for Flagsmith feature flag references
author: Flagsmith

inputs:
  feature_names:
    description: JSON array of feature names to search for
    required: true
  exclude_patterns:
    description: Comma-separated list of patterns to exclude from scanning
    required: false
    default: .git,node_modules,vendor,venv,.venv,__pycache__,.tox,.mypy_cache,.pytest_cache,.ruff_cache,dist,build,target,out,bin,obj,.next,.nuxt,.cache,coverage,htmlcov,.nyc_output

outputs:
  code_references:
    description: JSON array of code references found
    value: ${{ steps.collect.outputs.code_references }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.14'
        enable-cache: true

    - name: Collect code references
      id: collect
      shell: bash
      env:
        FEATURE_NAMES: ${{ inputs.feature_names }}
        EXCLUDE_PATTERNS: ${{ inputs.exclude_patterns }}
        SCAN_PATH: ${{ github.workspace }}
      working-directory: ${{ github.action_path }}/..
      run: uv run collect-code-references
